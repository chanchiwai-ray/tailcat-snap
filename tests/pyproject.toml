[project]
name = "tailcat-snap-tests"
version = "0.1.0"
description = "Two-node (LXD container) functional/integration tests for the tailcat snap"
readme = false
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "tenacity>=9.1.4",
]

[tool.pytest.ini_options]
testpaths = ["functional"]
addopts = "-ra -v"
markers = [
    "integration: real-network tests against live Tailscale DERP infrastructure",
]

[tool.ruff]
line-length = 99
preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "C90", "N", "I"]
ignore = ["E501", "N818"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
