# Snap packaging for tailcat (https://github.com/tailscale/tailcat)
# This is an unofficial, community-maintained snap packaging of tailcat.
name: tailcat
base: core24
version: 0.5.0
contact: chanchiwairay@gmail.com
issues: https://github.com/chanchiwai-ray/tailcat-snap/issues
summary: Like netcat, but over Tailscale's data plane, without the control plane
description: |
  Tailcat is a remix of Tailscale open source pieces to act like netcat, but over Tailscale's data
  plane, without Tailscale's control plane. Tailscale's data plane (magicsock) gives you
  point-to-point WireGuard-encrypted tunnels between two machines, using DERP relays for NAT
  hole-punching and as a relay of last resort. Unlike Tailscale itself, tailcat needs no account,
  no control plane, and no root/admin access. All connection metadata is exchanged out of band
  (e.g. by copy/paste or DNS TXT record) and everything runs in userspace via a gVisor netstack.

  Please refer to the upstream project https://github.com/tailscale/tailcat for more information.

grade: devel
confinement: strict
license: BSD-3-Clause

apps:
  tailcat:
    command: bin/tailcat
    plugs:
      - home
      - network
      - network-bind
    environment:
      # Ensure the bundled ssh/scp (staged below) are found by
      # exec.LookPath("ssh")/("scp") inside "tailcat ssh"/"tailcat cp",
      # ahead of anything from the base runtime.
      PATH: $SNAP/usr/bin:$PATH

# The staged OpenSSH client's "scp" binary invokes "ssh" as a subprocess
# via a compile-time hardcoded absolute path (/usr/bin/ssh), not via
# $PATH -- confirmed with `strings usr/bin/scp | grep ssh`. That path
# resolves to the base snap's /usr/bin/ssh (which doesn't exist / isn't
# executable under strict confinement), regardless of where our own
# bundled ssh actually lives. This layout bind-mounts our bundled ssh
# onto that exact hardcoded path, inside this snap's own confined view
# only (it has no effect outside the snap's own mount namespace).
layout:
  /usr/bin/ssh:
    bind-file: $SNAP/usr/bin/ssh

parts:
  tailcat:
    plugin: go
    source: https://github.com/tailscale/tailcat.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    source-type: git
    build-snaps:
      - go/latest/stable
    build-environment:
      - CGO_ENABLED: "0"
    # Bundle the OpenSSH client so "tailcat ssh"/"tailcat cp" (which exec
    # the system ssh/scp as a ProxyCommand wrapper around tailcat itself)
    # have something to exec. Strict confinement's AppArmor policy allows
    # executing binaries that are part of the snap's own content (an "ix"
    # inherit-exec transition, so the child stays in the exact same
    # confined profile), but denies executing arbitrary binaries outside
    # it -- which is why exec'ing the base system's /usr/bin/scp/ssh fails
    # with "permission denied" otherwise (see docs/known_issues.md).
    stage-packages:
      - openssh-client
    # NOTE: the go plugin's build commands always run `go install ./...`,
    # which would also build the repo's other main packages (cmd/tailcat-web,
    # cmd/tailcat-webdist, tool/updateflakes, internal/buildtags/printtags)
    # into $CRAFT_PART_INSTALL/bin, and the plugin has no go-buildpkg or
    # go-flags keys to select a single package or pass -ldflags. go-buildtags
    # is kept below purely as documentation of the tag list (it has no effect
    # once override-build replaces the plugin's build step); the same tags
    # are duplicated into the override-build script below.
    go-buildtags:
      - netgo
      - omitidna
      - omitpemdecrypt
      - osusergo
      - ts_omit_ace
      - ts_omit_acme
      - ts_omit_advertiseexitnode
      - ts_omit_advertiseroutes
      - ts_omit_appconnectors
      - ts_omit_aws
      - ts_omit_bird
      - ts_omit_cachenetmap
      - ts_omit_captiveportal
      - ts_omit_capture
      - ts_omit_cliconndiag
      - ts_omit_clientmetrics
      - ts_omit_clientupdate
      - ts_omit_cloud
      - ts_omit_colorable
      - ts_omit_completion
      - ts_omit_completion_scripts
      - ts_omit_conn25
      - ts_omit_debug
      - ts_omit_debugeventbus
      - ts_omit_debugportmapper
      - ts_omit_desktop_sessions
      - ts_omit_dns
      - ts_omit_doctor
      - ts_omit_drive
      - ts_omit_favorites
      - ts_omit_flashappliance
      - ts_omit_health
      - ts_omit_hujsonconf
      - ts_omit_identityfederation
      - ts_omit_ipnbus
      - ts_omit_iptables
      - ts_omit_kube
      - ts_omit_linkspeed
      - ts_omit_linuxdnsfight
      - ts_omit_listenrawdisco
      - ts_omit_logtail
      - ts_omit_netlog
      - ts_omit_networkmanager
      - ts_omit_oauthkey
      - ts_omit_osrouter
      - ts_omit_outboundproxy
      - ts_omit_peerapiclient
      - ts_omit_peerapiserver
      - ts_omit_portlist
      - ts_omit_portmapper
      - ts_omit_posture
      - ts_omit_qrcodes
      - ts_omit_relayserver
      - ts_omit_remoteconfig
      - ts_omit_resolved
      - ts_omit_routecheck
      - ts_omit_runtimemetrics
      - ts_omit_sdnotify
      - ts_omit_serve
      - ts_omit_serviceclientprefs
      - ts_omit_synology
      - ts_omit_syslog
      - ts_omit_syspolicy
      - ts_omit_systray
      - ts_omit_taildrop
      - ts_omit_tailnetlock
      - ts_omit_tap
      - ts_omit_tpm
      - ts_omit_tundevstats
      - ts_omit_unixsocketidentity
      - ts_omit_useexitnode
      - ts_omit_useproxy
      - ts_omit_usermetrics
      - ts_omit_useroutes
      - ts_omit_wakeonlan
      - ts_omit_webbrowser
      - ts_omit_webclient
    override-build: |
      TAGS="netgo,omitidna,omitpemdecrypt,osusergo,ts_omit_ace,ts_omit_acme,ts_omit_advertiseexitnode,ts_omit_advertiseroutes,ts_omit_appconnectors,ts_omit_aws,ts_omit_bird,ts_omit_cachenetmap,ts_omit_captiveportal,ts_omit_capture,ts_omit_cliconndiag,ts_omit_clientmetrics,ts_omit_clientupdate,ts_omit_cloud,ts_omit_colorable,ts_omit_completion,ts_omit_completion_scripts,ts_omit_conn25,ts_omit_debug,ts_omit_debugeventbus,ts_omit_debugportmapper,ts_omit_desktop_sessions,ts_omit_dns,ts_omit_doctor,ts_omit_drive,ts_omit_favorites,ts_omit_flashappliance,ts_omit_health,ts_omit_hujsonconf,ts_omit_identityfederation,ts_omit_ipnbus,ts_omit_iptables,ts_omit_kube,ts_omit_linkspeed,ts_omit_linuxdnsfight,ts_omit_listenrawdisco,ts_omit_logtail,ts_omit_netlog,ts_omit_networkmanager,ts_omit_oauthkey,ts_omit_osrouter,ts_omit_outboundproxy,ts_omit_peerapiclient,ts_omit_peerapiserver,ts_omit_portlist,ts_omit_portmapper,ts_omit_posture,ts_omit_qrcodes,ts_omit_relayserver,ts_omit_remoteconfig,ts_omit_resolved,ts_omit_routecheck,ts_omit_runtimemetrics,ts_omit_sdnotify,ts_omit_serve,ts_omit_serviceclientprefs,ts_omit_synology,ts_omit_syslog,ts_omit_syspolicy,ts_omit_systray,ts_omit_taildrop,ts_omit_tailnetlock,ts_omit_tap,ts_omit_tpm,ts_omit_tundevstats,ts_omit_unixsocketidentity,ts_omit_useexitnode,ts_omit_useproxy,ts_omit_usermetrics,ts_omit_useroutes,ts_omit_wakeonlan,ts_omit_webbrowser,ts_omit_webclient"
      mkdir -p "${CRAFT_PART_INSTALL}/bin"
      go build \
        -tags "${TAGS}" \
        -ldflags="-s -w" \
        -o "${CRAFT_PART_INSTALL}/bin/tailcat" \
        ./cmd/tailcat
